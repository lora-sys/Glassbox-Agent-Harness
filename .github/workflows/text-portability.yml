name: Text portability

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: text-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  text-portability:
    name: Text encoding and line-ending portability
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Check Windows-authored text survives Linux
        run: npm run portability:check
