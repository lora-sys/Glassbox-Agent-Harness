name: Hygiene CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code and test hygiene (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Use locked npm version
        run: npm install --global npm@12.0.2

      - name: Install locked dependencies
        run: npm ci

      - name: Check repository, database and toolchain hygiene
        run: npm run hygiene:check

      - name: Check changed tests were not weakened
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: node scripts/check-test-hygiene.mjs

      - name: Run full deterministic verification
        run: npm run verify:full

      - name: Check generated route tree is current
        run: git diff --exit-code -- apps/web/src/routeTree.gen.ts

  browser-protocol:
    name: Browser and live management protocol
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Use locked npm version
        run: npm install --global npm@12.0.2

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise Web and live management HTTP
        run: npm run test:web:browser

  dependency-hygiene:
    name: Dependency hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Use locked npm version
        run: npm install --global npm@12.0.2

      - name: Install locked dependencies
        run: npm ci

      - name: Check dependency vulnerabilities
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

      - name: Check production dependency vulnerabilities at moderate severity
        run: npm audit --registry=https://registry.npmjs.org --omit=dev --audit-level=moderate

  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: trufflesecurity/trufflehog@74d1c44c2b4e6612c5d248b0e50fc40c0ecfa165 # v3.97.0 action
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          version: 3.97.0
          extra_args: --results=verified,unknown

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

  pull-request-hygiene:
    name: Pull request title hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check pull request title
        run: node scripts/check-pr-title.mjs
