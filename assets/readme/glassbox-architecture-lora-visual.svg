<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <style>
      .sans{font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif}
      .ink{fill:#171513}.brown{fill:#7A6045}.amber{fill:#D3A95F}.warm{fill:#B89061}.paper{fill:#F3EBDD}.cream{fill:#FBF7EF}.charcoal{fill:#201E1B}
      .line{stroke:#7A6045;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
    </style>
  </defs>
  <rect width="1800" height="1000" fill="#F3EBDD"/>
  <rect x="55" y="55" width="1690" height="890" rx="42" fill="#FBF7EF" stroke="#201E1B" stroke-width="5"/>

  <text x="110" y="155" class="sans brown" font-size="40">P3 闭环</text>
  <text x="110" y="285" class="sans ink" font-size="74" font-weight="700">同一个 Agent，多身份，不越权</text>
  <text x="110" y="337" class="sans warm" font-size="32" font-weight="700">身份 → 权限 → 会话 → 执行 → 证据</text>

  <g class="sans">
    <rect x="100" y="425" width="210" height="105" rx="22" fill="#F3EBDD" stroke="#C8B69D" stroke-width="2"/>
    <text x="155" y="472" font-size="30" font-weight="700" fill="#171513">Owner</text><text x="140" y="505" font-size="20" fill="#7A6045">私有 + 公开</text>
    <rect x="100" y="585" width="210" height="105" rx="22" fill="#F3EBDD" stroke="#C8B69D" stroke-width="2"/>
    <text x="150" y="632" font-size="30" font-weight="700" fill="#171513">Visitor</text><text x="152" y="665" font-size="20" fill="#7A6045">仅公开</text>
  </g>

  <rect x="395" y="455" width="200" height="205" rx="26" fill="#F3EBDD" stroke="#7A6045" stroke-width="3"/>
  <text x="455" y="520" class="sans ink" font-size="36" font-weight="700">身份</text>
  <circle cx="495" cy="575" r="30" fill="#D3A95F"/>
  <text x="478" y="585" class="sans ink" font-size="23" font-weight="700">ID</text>

  <path d="M310 477 L395 525" class="line"/><path d="M380 515 l15 10 -18 2z" fill="#7A6045"/>
  <path d="M310 637 L395 590" class="line"/><path d="M380 592 l15 -2 -11 15z" fill="#7A6045"/>

  <rect x="670" y="395" width="245" height="315" rx="30" fill="#201E1B"/>
  <text x="730" y="465" class="sans" font-size="40" font-weight="700" fill="#FBF7EF">权限门</text>
  <text x="730" y="510" class="sans" font-size="26" font-weight="700" fill="#D3A95F">默认拒绝</text>
  <line x1="715" y1="545" x2="870" y2="545" stroke="#8A6D50" stroke-width="3"/>
  <rect x="715" y="580" width="155" height="52" rx="14" fill="#D3A95F"/><text x="746" y="614" class="sans ink" font-size="23" font-weight="700">公开：允许</text>
  <rect x="715" y="648" width="155" height="52" rx="14" fill="#4A433B"/><text x="746" y="682" class="sans" font-size="23" font-weight="700" fill="#FBF7EF">私有：拒绝</text>

  <g transform="translate(846,675) scale(.75)">
    <path d="M20 35 L37 10 L54 34 Q78 30 91 49 Q105 70 94 94 Q83 116 53 119 Q22 118 10 95 Q-2 69 11 49 Q15 42 20 35Z" fill="#FBF7EF" stroke="#201E1B" stroke-width="4"/>
    <circle cx="37" cy="68" r="4" fill="#171513"/><circle cx="65" cy="68" r="4" fill="#171513"/>
    <path d="M43 83 Q52 91 61 83" fill="none" stroke="#171513" stroke-width="3" stroke-linecap="round"/>
    <path d="M87 70 L119 84 L114 124 Q100 139 87 145 Q73 139 60 124 L55 84 Z" fill="#D3A95F" stroke="#201E1B" stroke-width="3"/>
  </g>

  <path d="M595 558 H670" class="line"/><path d="M670 558 l-18 -11 v22z" fill="#7A6045"/>

  <rect x="1010" y="455" width="205" height="205" rx="26" fill="#F3EBDD" stroke="#7A6045" stroke-width="3"/>
  <text x="1060" y="520" class="sans ink" font-size="36" font-weight="700">会话</text>
  <text x="1048" y="574" class="sans brown" font-size="24">Conversation</text>
  <text x="1060" y="620" class="sans warm" font-size="22" font-weight="700">持久恢复</text>
  <path d="M915 558 H1010" class="line"/><path d="M1010 558 l-18 -11 v22z" fill="#7A6045"/>

  <rect x="1310" y="420" width="245" height="275" rx="30" fill="#F3EBDD" stroke="#7A6045" stroke-width="3"/>
  <text x="1340" y="493" class="sans ink" font-size="30" font-weight="700">Personal Agent</text>
  <rect x="1350" y="535" width="165" height="62" rx="18" fill="#201E1B"/>
  <text x="1402" y="576" class="sans" font-size="27" font-weight="700" fill="#FBF7EF">Run</text>
  <rect x="1350" y="615" width="165" height="52" rx="16" fill="#FBF7EF" stroke="#B89061" stroke-width="2"/>
  <text x="1375" y="649" class="sans brown" font-size="21" font-weight="700">Tool 再鉴权</text>
  <path d="M1215 558 H1310" class="line"/><path d="M1310 558 l-18 -11 v22z" fill="#7A6045"/>

  <rect x="1620" y="455" width="125" height="205" rx="24" fill="#F3EBDD" stroke="#7A6045" stroke-width="3"/>
  <text x="1647" y="520" class="sans ink" font-size="32" font-weight="700">证据</text>
  <text x="1649" y="575" class="sans brown" font-size="23">Trace</text>
  <text x="1647" y="620" class="sans warm" font-size="23" font-weight="700">Turso</text>
  <path d="M1555 558 H1620" class="line"/><path d="M1620 558 l-18 -11 v22z" fill="#7A6045"/>

  <rect x="405" y="770" width="1090" height="115" rx="25" fill="#F3EBDD" stroke="#C8B69D" stroke-width="2"/>
  <text x="720" y="820" class="sans ink" font-size="31" font-weight="700">未授权数据不进入模型</text>
  <text x="735" y="860" class="sans brown" font-size="24">每次 Allow / Deny 都留下证据</text>
</svg>