<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Glassbox, inspect agent work on a canvas</title>
  <desc id="desc">Lora organizes plans, diffs, tests, approvals, and results on a persistent agent workspace.</desc>
  <defs><pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="0.7" fill="#8B5E34" opacity="0.08"/></pattern><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#4F8078" opacity="0.2"/></pattern></defs>
  <rect width="1200" height="380" rx="28" fill="#F7F4EE"/><rect width="1200" height="380" rx="28" fill="url(#paper)"/><path d="M0 8H1200" stroke="#E0A62F" stroke-width="8"/>
  <g id="title-block" transform="translate(58 54)">
    <text fill="#8B5E34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="750" letter-spacing="2.5">CANVAS-NATIVE AGENT WORKBENCH</text>
    <text y="88" fill="#1A1A1A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="74" font-weight="850" letter-spacing="-2">Glassbox</text>
    <text y="139" fill="#4F8078" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" font-weight="760">把 Agent 的工作留在一张可检查的画布上</text>
    <path d="M0 171H500" stroke="#1A1A1A" stroke-width="1.5" opacity="0.16"/>
    <text y="207" fill="#4A4A4A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">计划、动作、Diff、测试、审批和结果保持可见。</text>
    <g transform="translate(0 250)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800"><text fill="#1A1A1A">RUN</text><text x="47" fill="#E0A62F">→</text><text x="76" fill="#1A1A1A">EVENT</text><text x="143" fill="#E0A62F">→</text><text x="172" fill="#1A1A1A">STATE</text><text x="233" fill="#E0A62F">→</text><text x="262" fill="#4F8078">CANVAS</text></g>
  </g>
  <g id="canvas" transform="translate(602 42)">
    <rect width="542" height="296" rx="24" fill="#EDE6D6" stroke="#8B5E34" stroke-opacity="0.24"/><rect x="16" y="16" width="510" height="264" rx="18" fill="url(#dots)"/>
    <path d="M44 66h120M44 66v70M214 220h124M338 220v-72" fill="none" stroke="#4F8078" stroke-width="2" stroke-dasharray="5 7" opacity="0.55"/>
    <g font-family="ui-monospace, monospace" font-size="12" font-weight="750">
      <g transform="translate(32 42)"><rect width="118" height="58" rx="10" fill="#F7F4EE" stroke="#1A1A1A" stroke-opacity="0.15"/><circle cx="18" cy="18" r="6" fill="#E0A62F"/><text x="32" y="22" fill="#1A1A1A">PLAN</text><path d="M18 36h78M18 44h54" stroke="#8B5E34" opacity="0.35"/></g>
      <g transform="translate(176 92)"><rect width="136" height="66" rx="10" fill="#F7F4EE" stroke="#1A1A1A" stroke-opacity="0.15"/><circle cx="18" cy="18" r="6" fill="#4F8078"/><text x="32" y="22" fill="#1A1A1A">DIFF</text><path d="M18 38h42M72 38h46M18 48h32M60 48h58" stroke="#4F8078" opacity="0.45"/></g>
      <g transform="translate(54 190)"><rect width="130" height="60" rx="10" fill="#F7F4EE" stroke="#1A1A1A" stroke-opacity="0.15"/><circle cx="18" cy="18" r="6" fill="#4F7A64"/><text x="32" y="22" fill="#1A1A1A">TEST</text><path d="M18 42l7 7 14-18" fill="none" stroke="#4F7A64" stroke-width="3"/></g>
      <g transform="translate(334 44)"><rect width="130" height="62" rx="10" fill="#1A1A1A"/><circle cx="18" cy="18" r="6" fill="#E0A62F"/><text x="32" y="22" fill="#F7F4EE">APPROVAL</text><path d="M18 43h92" stroke="#E0A62F" opacity="0.55"/></g>
    </g>
  </g>
  <image id="lora-canvas" x="898" y="8" width="250" height="374" xlink:href="hero-subject-v1.png" preserveAspectRatio="xMidYMid meet"/>
</svg>
