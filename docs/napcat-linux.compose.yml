services:
  napcat:
    # NapCat v4.18.30 includes recovery for silent QQ session loss.
    image: mlikiowa/napcat-docker@sha256:335f9310198504d8d07aba91cc91d89215269891919c26eb4e46052ff8bb176d
    restart: unless-stopped
    environment:
      NAPCAT_UID: ${NAPCAT_UID:?Set the Linux user ID}
      NAPCAT_GID: ${NAPCAT_GID:?Set the Linux group ID}
    ports:
      - "127.0.0.1:6700:6700"
      - "127.0.0.1:6099:6099"
    volumes:
      - ${NAPCAT_DATA_DIR:?Set the protected Linux NapCat data directory}/config:/app/napcat/config
      - ${NAPCAT_DATA_DIR:?Set the protected Linux NapCat data directory}/ntqq:/app/.config/QQ
